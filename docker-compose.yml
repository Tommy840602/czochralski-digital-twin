# ============================================================
#  長晶爐數位孿生 — 基礎設施一鍵啟動
#  Czochralski Digital Twin Infrastructure
# ============================================================

x-restart: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

networks:
  twin-net:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  timescale-data:
  mongo-data:
  redis-data:
  elasticsearch-data:
  grafana-data:
  prometheus-data:
  mosquitto-data:
  mosquitto-log:
  flink-checkpoint:

services:

  # ─────────────────────────────────────────
  # 1. MQTT BROKER (Eclipse Mosquitto)
  # ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: twin-mosquitto
    <<: [*restart-policy, *default-logging]
    ports:
      - "1883:1883"    # MQTT
      - "9001:9001"    # WebSocket
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 2. ZOOKEEPER (Kafka 依賴)
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: twin-zookeeper
    <<: [*restart-policy, *default-logging]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # 3. KAFKA BROKER
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: twin-kafka
    <<: [*restart-policy, *default-logging]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"      # 外部連線
      - "9093:9093"      # 內部 Docker
      - "9094:9094"      # JMX Exporter
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9093 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 200s
    stop_grace_period: 30s

  # ─────────────────────────────────────────
  # 4. KAFKA SCHEMA REGISTRY
  # ─────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: twin-schema-registry
    <<: [*restart-policy, *default-logging]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9093
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────
  # 5. KAFKA TOPICS INIT (一次性建立 Topics)
  # ─────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: twin-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - twin-net
    restart: "no"
    command:
      - bash
      - -c
      - |
        echo '=== 建立 Kafka Topics ==='
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic furnace-data --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic sensor-events --partitions 3 --replication-factor 1 --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic alarm-events --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        echo '=== Topics 清單 ==='
        kafka-topics --bootstrap-server kafka:9093 --list
        echo '=== 完成 ==='

  # ─────────────────────────────────────────
  # 6. KAFKA UI (便於開發查看)
  # ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: twin-kafka-ui
    <<: [*restart-policy, *default-logging]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: twin-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_METRICS_PORT: 9999
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - twin-net

  # ─────────────────────────────────────────
  # 7. FLINK JOB MANAGER
  # ─────────────────────────────────────────
  flink-jobmanager:
    image: flink:2.2.1-java17
    container_name: twin-flink-jobmanager
    <<: [*restart-policy, *default-logging]
    command: jobmanager
    ports:
      - "8083:8081"    # Flink Web UI
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        rest.flamegraph.enabled: true
    volumes:
      - flink-checkpoint:/opt/flink/checkpoints
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # 8. FLINK TASK MANAGER
  # ─────────────────────────────────────────
  flink-taskmanager:
    image: flink:2.2.1-java17
    container_name: twin-flink-taskmanager
    <<: [*restart-policy, *default-logging]
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoint:/opt/flink/checkpoints
    networks:
      - twin-net

  # ─────────────────────────────────────────
  # 9. TIMESCALEDB (長晶爐時序數據)
  # ─────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: twin-timescaledb
    <<: [*restart-policy, *default-logging]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin_secret
      POSTGRES_DB: furnace_db
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d furnace_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # 10. MONGODB (感測器數據 + Alarms)
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: twin-mongodb
    <<: [*restart-policy, *default-logging]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: twin
      MONGO_INITDB_ROOT_PASSWORD: twin_secret
      MONGO_INITDB_DATABASE: twin_db
    volumes:
      - mongo-data:/data/db
      - ./infra/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # 11. REDIS (即時快取 + Pub/Sub)
  # ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: twin-redis
    <<: [*restart-policy, *default-logging]
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
      --notify-keyspace-events "Ex"
    volumes:
      - redis-data:/data
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────
  # 12. ELASTICSEARCH (系統 Log)
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: twin-elasticsearch
    <<: [*restart-policy, *default-logging]
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=twin-es-cluster
      - node.name=twin-es-node
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ─────────────────────────────────────────
  # 13. KIBANA (Log 分析 UI)
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: twin-kibana
    <<: [*restart-policy, *default-logging]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      KIBANA_SYSTEM_PASSWORD: twin_secret
      xpack.security.enabled: "false"
      SERVER_NAME: twin-kibana
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status | grep -q 'available'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ─────────────────────────────────────────
  # 14. LOGSTASH (Log Pipeline)
  # ─────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: twin-logstash
    <<: [*restart-policy, *default-logging]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"    # Beats input
      - "5010:5000/tcp"
      - "5010:5000/udp"
      - "9600:9600"    # Logstash API
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - ./infra/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./infra/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    networks:
      - twin-net

  # ─────────────────────────────────────────
  # 15. PROMETHEUS
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: twin-prometheus
    <<: [*restart-policy, *default-logging]
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 16. GRAFANA
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: twin-grafana
    <<: [*restart-policy, *default-logging]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: twin_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # 17. NODE EXPORTER (主機指標)
  # ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: twin-node-exporter
    <<: [*restart-policy, *default-logging]
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro

  eureka-server:
    build: ./services/eureka-server
    container_name: twin-eureka
    ports:
      - "8761:8761"
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8761 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  config-server:
    build: ./services/config-server
    container_name: twin-config
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  iot-gateway:
    build: ./services/iot-gateway
    container_name: twin-iot-gateway
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://twin-config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://twin-eureka:8761/eureka/
      - SPRING_MQTT_BROKER_URL=tcp://twin-mosquitto:1883
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=twin-kafka:9093
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - twin-net

  furnace-service:
    build: ./services/furnace-service
    container_name: twin-furnace-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://twin-config:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://twin-timescaledb:5432/furnace_db
      - SPRING_DATASOURCE_USERNAME=twin
      - SPRING_DATASOURCE_PASSWORD=twin_secret
      - SPRING_DATA_REDIS_HOST=twin-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=twin-kafka:9093
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://twin-eureka:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=twin-furnace-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 200s

  alarm-service:
    build: ./services/alarm-service
    container_name: twin-alarm-service
    ports:
      - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://twin-config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://twin-eureka:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=twin-kafka:9093
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - twin-net

  api-gateway:
    build: ./services/api-gateway
    container_name: twin-api-gateway
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://twin-config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://twin-eureka:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  frontend:
    build: frontend
    container_name: twin-frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      furnace-service:
        condition: service_healthy
    networks:
      - twin-net

  flink-job-submitter:
    image: curlimages/curl:latest
    container_name: twin-flink-submitter
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - ./flink-jobs/target:/jars:ro
    networks:
      - twin-net
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Flink..."
        sleep 10
        echo "Uploading jar..."
        RESPONSE=$$(curl -s -X POST http://twin-flink-jobmanager:8081/jars/upload \
          -H "Expect:" \
          -F "jarfile=@/jars/flink-jobs-1.0.0-SNAPSHOT.jar")
        JAR_ID=$$(echo $$RESPONSE | grep -o '"filename":"[^"]*"' | sed 's|.*upload/||;s|"||g')
        echo "JAR ID: $$JAR_ID"
        sleep 3
        curl -s -X POST "http://twin-flink-jobmanager:8081/jars/$$JAR_ID/run" \
          -H "Content-Type: application/json" \
          -d '{"entryClass":"com.twin.flink.job.FurnaceStreamJob","parallelism":1}'
        echo "Job submitted!"

  simulator-d1:
    build: ./datapipe
    container_name: twin-simulator-d1
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "D1", "--csv", "data/D1_all.csv", "--interval", "0.1", "--host", "twin-mosquitto", "--api-port", "8091", "--loop"]
    networks:
      - twin-net

  simulator-d3:
    build: ./datapipe
    container_name: twin-simulator-d3
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "D3", "--csv", "data/D3_all.csv", "--interval", "0.1", "--host", "twin-mosquitto", "--api-port", "8092", "--loop"]
    networks:
      - twin-net

  simulator-db:
    build: ./datapipe
    container_name: twin-simulator-db
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "DB", "--csv", "data/DB_all.csv", "--interval", "0.1", "--host", "twin-mosquitto", "--api-port", "8093", "--loop"]
    networks:
      - twin-net

  simulator-f7:
    build: ./datapipe
    container_name: twin-simulator-f7
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "F7", "--csv", "data/F7_all.csv", "--interval", "0.1", "--host", "twin-mosquitto", "--api-port", "8094", "--loop"]
    networks:
      - twin-net

  simulator-fa:
    build: ./datapipe
    container_name: twin-simulator-fa
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "FA", "--csv", "data/FA_all.csv", "--interval", "0.1", "--host", "twin-mosquitto", "--api-port", "8095", "--loop"]
    networks:
      - twin-net
