# ============================================================
#  ⚠ 這個檔案由 docker-compose.yml 轉換而來（scripts/gen-prod-compose.py）
#     改動請先改 dev 版，再重新生成，避免兩邊分歧。
#
#  與 dev 的差異：
#    1. 不發布任何 host port —— 只有 caddy 綁 80/443
#    2. 所有密碼改為必填環境變數（.env.prod）
#    3. Redis 加上 requirepass
#    4. 每個容器設記憶體上限（目標：CX43 / 16GB）
#    5. restart: always
#
#  ── 記憶體預算（Hetzner CX43 = 16GB，OS + Docker 約佔 1.2GB）──────────
#
#  預設啟動的容器 mem_limit 總和 ≈ 14.5 GB。
#  注意 mem_limit 是「上限」不是「預留」——實際用量預估 10～12 GB。
#  跑起來後務必用 scripts/mem-report.sh 量真實數字再決定要不要調整。
#
#  可選元件（預設不啟動，用 --profile 開啟）：
#    --profile elk     Elasticsearch + Kibana + Logstash   (+3.0 GB)
#    --profile extras  Schema Registry（目前程式碼沒用到）  (+0.4 GB)
#
#  例：docker compose --env-file .env.prod -f docker-compose.prod.yml \
#        --profile elk up -d
#
#  16GB 機器上請保持 elk 關閉；升級到 32GB 之後再開。
# ============================================================
#  長晶爐數位孿生 — 基礎設施一鍵啟動
#  Czochralski Digital Twin Infrastructure
# ============================================================

x-restart: &restart-policy
  restart: always

# Spring Boot 服務共用的 JVM 參數。
#   MaxRAMPercentage：讓 JVM 依「容器」上限算 heap，而不是主機記憶體
#   UseSerialGC     ：小 heap + 少核心的情境下，比 G1 省幾十 MB 且延遲夠用
x-jvm: &jvm-opts "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

networks:
  twin-net:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  timescale-data:
  mongo-data:
  redis-data:
  elasticsearch-data:
  grafana-data:
  prometheus-data:
  mosquitto-data:
  mosquitto-log:
  flink-checkpoint:
  caddy-data:
  caddy-config:

services:

  # ─────────────────────────────────────────
  # 0. CADDY — 唯一對公網開放的入口（反向代理 + 自動 TLS）
  #    其餘服務一律只走 twin-net，不發布任何 host port。
  # ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: twin-caddy
    mem_limit: 128m
    <<: [*restart-policy, *default-logging]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # DOMAIN   = 根網域（子網域掛在它下面）：tommy-huang.dev
      # APP_HOST = 主站網址：twin.tommy-huang.dev
      #
      # ⚠ 這兩個是不同的東西。APP_HOST 一改，下面所有服務的 CORS / WebSocket
      #   origins / OAuth callback / 密碼重設連結都要跟著改——它們全都從
      #   APP_HOST 推導，所以改一個地方就好。
      #   但**三家 OAuth App 後台的 callback URL 要另外手動改**，那在外部系統。
      DOMAIN: ${DOMAIN:?未設定}
      APP_HOST: ${APP_HOST:?未設定}
      ACME_EMAIL: ${ACME_EMAIL:?未設定}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?未設定}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - twin-net
    depends_on:
      - frontend

  # ─────────────────────────────────────────
  # 1. MQTT BROKER (Eclipse Mosquitto)
  # ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: twin-mosquitto
    mem_limit: 128m
    <<: [*restart-policy, *default-logging]
    # ports: 不對外發布（只有 caddy 綁 80/443）
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 2. ZOOKEEPER (Kafka 依賴)
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: twin-zookeeper
    mem_limit: 384m
    <<: [*restart-policy, *default-logging]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      # 只管 1 個 broker，256m heap 綽綽有餘（預設是 512m）
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # 3. KAFKA BROKER
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: twin-kafka
    # 實測用量 873 MiB（85% of 1g）——太貼近上限，尖峰會被 OOM kill。
    # heap 只有 640m，其餘是 off-heap 與 page cache（Kafka 重度依賴後者）。
    mem_limit: 1536m
    <<: [*restart-policy, *default-logging]
    depends_on:
      zookeeper:
        condition: service_healthy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      # 單 broker、3 個 topic、低吞吐 → 640m heap 足夠（預設 1g）。
      # 剩下的容器記憶體留給 page cache，Kafka 讀寫本來就重度依賴它。
      KAFKA_HEAP_OPTS: "-Xms640m -Xmx640m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9093 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 200s
    stop_grace_period: 30s

  # ─────────────────────────────────────────
  # 4. KAFKA SCHEMA REGISTRY  ── 可選（--profile extras）
  #
  #    目前程式碼「沒有用到」它：Kafka 訊息是純 JSON，沒有 Avro。
  #    iot-gateway 的 application.yml 雖然有 `kafka.schema-registry` 這個
  #    設定值，但 Java 端從未讀取（grep 過，零引用）——是遺留設定。
  #    16GB 機器上省下 512m 比留著它有意義。
  # ─────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: twin-schema-registry
    profiles: ["extras"]
    mem_limit: 384m
    <<: [*restart-policy, *default-logging]
    depends_on:
      kafka:
        condition: service_healthy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9093
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────
  # 5. KAFKA TOPICS INIT (一次性建立 Topics)
  # ─────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: twin-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - twin-net
    restart: "no"
    command:
      - bash
      - -c
      - |
        echo '=== 建立 Kafka Topics ==='
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic furnace-data --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic sensor-events --partitions 3 --replication-factor 1 --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic alarm-events --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        echo '=== Topics 清單 ==='
        kafka-topics --bootstrap-server kafka:9093 --list
        echo '=== 完成 ==='

  # ─────────────────────────────────────────
  # 6. KAFKA UI (便於開發查看)
  # ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: twin-kafka-ui
    mem_limit: 384m
    <<: [*restart-policy, *default-logging]
    depends_on:
      kafka:
        condition: service_healthy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      KAFKA_CLUSTERS_0_NAME: twin-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      # SCHEMAREGISTRY 拿掉：schema-registry 預設不啟動（--profile extras），
      # 留著會讓 kafka-ui 每次輪詢都對一個不存在的 host 噴錯。
      KAFKA_CLUSTERS_0_METRICS_PORT: 9999
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
    networks:
      - twin-net

  # ─────────────────────────────────────────
  # 7. FLINK JOB MANAGER
  # ─────────────────────────────────────────
  flink-jobmanager:
    image: flink:2.2.1-java17
    container_name: twin-flink-jobmanager
    mem_limit: 1g
    <<: [*restart-policy, *default-logging]
    command: jobmanager
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      # ⚠ 這些「必須」也給 JobManager，不是只給 TaskManager。
      #
      #   FurnaceStreamJob 是這樣寫的：
      #       static final String RPASS = System.getenv()...   // 類別載入時求值
      #       stream.sinkTo(new RedisSink(RHOST, RPORT, RPASS)); // 在 main() 裡建構
      #
      #   main() 跑在 JobManager（提交 job、建 execution graph 時），不是 TaskManager。
      #   密碼在 JobManager 讀出來、序列化進 sink 物件，才送去 TaskManager 執行。
      #   只給 TaskManager 的話，RPASS 是空字串 → Jedis 不送 AUTH →
      #   Redis 回 "ERR Protocol error: unauthenticated multibulk length" →
      #   sink 拋 IOException → 整個 job 無限重啟。
      #
      #   （TimescaleDbSink 和 RegistryFilter 是在 open() 裡讀 env，那才是在
      #     TaskManager 執行，所以它們只要 TaskManager 有值就夠——也因此
      #     資料進得了 TimescaleDB 卻進不了 Redis，症狀非常容易誤導。）
      - TIMESCALE_URL=jdbc:postgresql://twin-timescaledb:5432/furnace_db
      - TIMESCALE_USER=${POSTGRES_USER:-twin}
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD}
      - MONGO_URI=mongodb://${MONGO_USER:-twin}:${MONGO_PASSWORD}@twin-mongodb:27017/twin_db?authSource=admin
      - REDIS_HOST=twin-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP=twin-kafka:9093
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 900m
        taskmanager.memory.process.size: 1792m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        rest.flamegraph.enabled: true
        akka.ask.timeout: 60 s
        web.timeout: 60000
        heartbeat.timeout: 180000
        heartbeat.interval: 30000
    volumes:
      - flink-checkpoint:/opt/flink/checkpoints
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # 8. FLINK TASK MANAGER
  # ─────────────────────────────────────────
  flink-taskmanager:
    image: flink:2.2.1-java17
    container_name: twin-flink-taskmanager
    mem_limit: 2g
    <<: [*restart-policy, *default-logging]
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - TIMESCALE_URL=jdbc:postgresql://twin-timescaledb:5432/furnace_db
      - TIMESCALE_USER=${POSTGRES_USER:-twin}
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD}
      - MONGO_URI=mongodb://${MONGO_USER:-twin}:${MONGO_PASSWORD}@twin-mongodb:27017/twin_db?authSource=admin
      - REDIS_HOST=twin-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP=twin-kafka:9093
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1792m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        akka.ask.timeout: 60 s
        web.timeout: 60000
        heartbeat.timeout: 180000
        heartbeat.interval: 30000
    volumes:
      - flink-checkpoint:/opt/flink/checkpoints
    networks:
      - twin-net

  # ─────────────────────────────────────────
  # 9. TIMESCALEDB (長晶爐時序數據)
  # ─────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: twin-timescaledb
    # 實測只用 116 MiB（資料量還小）。上限留寬是刻意的——
    # 資料長大後 shared_buffers 和 page cache 都會吃，這裡不是浪費。
    mem_limit: 2560m
    <<: [*restart-policy, *default-logging]
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      # timescaledb-tune 預設讀「主機」記憶體去算 shared_buffers / work_mem，
      # 會遠超容器上限 → Postgres 被 OOM killer 用 signal 9 殺掉（本機發生過，
      # 整個 DB 進 recovery mode）。這裡必須明確鎖定調校基準。
      # 抓 mem_limit 的 ~75%，留 page cache 與連線的空間。
      TS_TUNE_MEMORY: 1900MB
      TS_TUNE_NUM_CPUS: "4"
      TS_TUNE_MAX_CONNS: "80"
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?未設定}
      POSTGRES_DB: furnace_db
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d furnace_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # 10. MONGODB (感測器數據 + Alarms)
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: twin-mongodb
    mem_limit: 1024m
    <<: [*restart-policy, *default-logging]
    # WiredTiger 預設 cache = (RAM-1GB)/2，同樣是讀「主機」記憶體 → 會爆掉容器上限。
    # 明確鎖定 0.4GB。
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.4"]
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-twin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?未設定}
      MONGO_INITDB_DATABASE: twin_db
    volumes:
      - mongo-data:/data/db
      - ./infra/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # 11. REDIS (即時快取 + Pub/Sub)
  # ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: twin-redis
    mem_limit: 512m
    <<: [*restart-policy, *default-logging]
    # ports: 不對外發布（只有 caddy 綁 80/443）
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?未設定}
      --maxmemory 320mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
      --notify-keyspace-events "Ex"
    volumes:
      - redis-data:/data
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ═════════════════════════════════════════════════════════════
  #  ELK ── 可選（--profile elk），16GB 機器上預設「關閉」
  #
  #  三個容器合計 3.0 GB，是整套系統最大的一塊非必要開銷。
  #  沒有任何應用服務依賴它們（grep 過 services/：零引用）——
  #  logstash 只是把 docker log 收進 ES 供 Kibana 查詢。
  #  關掉之後看 log 就用 `docker logs`，對兩台爐子的規模完全夠用。
  #
  #  升級到 32GB 之後，加 `--profile elk` 就會一起啟動。
  # ═════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────
  # 12. ELASTICSEARCH (系統 Log)
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: twin-elasticsearch
    profiles: ["elk"]
    mem_limit: 2g
    <<: [*restart-policy, *default-logging]
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=twin-es-cluster
      - node.name=twin-es-node
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ─────────────────────────────────────────
  # 13. KIBANA (Log 分析 UI)
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: twin-kibana
    profiles: ["elk"]
    mem_limit: 768m
    <<: [*restart-policy, *default-logging]
    depends_on:
      elasticsearch:
        condition: service_healthy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      KIBANA_SYSTEM_PASSWORD: ${ELASTIC_PASSWORD:-unused}
      xpack.security.enabled: "false"
      SERVER_NAME: twin-kibana
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status | grep -q 'available'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ─────────────────────────────────────────
  # 14. LOGSTASH (Log Pipeline)
  # ─────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: twin-logstash
    profiles: ["elk"]
    mem_limit: 768m
    <<: [*restart-policy, *default-logging]
    depends_on:
      elasticsearch:
        condition: service_healthy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - ./infra/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./infra/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    networks:
      - twin-net

  # ─────────────────────────────────────────
  # 15. PROMETHEUS
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: twin-prometheus
    mem_limit: 512m
    <<: [*restart-policy, *default-logging]
    # ports: 不對外發布（只有 caddy 綁 80/443）
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - twin-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 16. GRAFANA
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: twin-grafana
    mem_limit: 384m
    <<: [*restart-policy, *default-logging]
    depends_on:
      prometheus:
        condition: service_healthy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      GF_SECURITY_ADMIN_USER: ${ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?未設定}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # 17. NODE EXPORTER (主機指標)
  # ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: twin-node-exporter
    mem_limit: 96m
    <<: [*restart-policy, *default-logging]
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro

  eureka-server:
    build: ./services/eureka-server
    container_name: twin-eureka
    mem_limit: 448m
    <<: *restart-policy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      JAVA_TOOL_OPTIONS: *jvm-opts
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8761 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  config-server:
    build: ./services/config-server
    container_name: twin-config
    mem_limit: 448m
    <<: *restart-policy
    environment:
      JAVA_TOOL_OPTIONS: *jvm-opts
      # native profile 的 config-server 會在伺服端解析 ${SLACK_WEBHOOK_URL}，
      # 所以這裡也要有值，否則 alarm-service 拿到的是佔位 URL（Slack 會停用）
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    # ports: 不對外發布（只有 caddy 綁 80/443）
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  iot-gateway:
    build: ./services/iot-gateway
    container_name: twin-iot-gateway
    mem_limit: 512m
    <<: *restart-policy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://twin-config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://twin-eureka:8761/eureka/
      - SPRING_MQTT_BROKER_URL=tcp://twin-mosquitto:1883
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=twin-kafka:9093
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - twin-net

  furnace-service:
    build: ./services/furnace-service
    container_name: twin-furnace-service
    mem_limit: 640m
    <<: *restart-policy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://twin-config:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://twin-timescaledb:5432/furnace_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-twin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=twin-redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=twin-kafka:9093
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://twin-eureka:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=twin-furnace-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # /ws 由前端 nginx 直接代理到這裡（不經過 gateway），CORS 要自己設。
      # 沒設的話只允許 localhost，正式站的 SockJS 握手會 403 → 前端永遠 OFFLINE。
      - APP_WS_ALLOWED_ORIGINS=https://${APP_HOST}
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 200s

  alarm-service:
    build: ./services/alarm-service
    image: tommy840602/czochralski-alarm-service:latest
    container_name: twin-alarm-service
    mem_limit: 768m
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      JAVA_TOOL_OPTIONS: *jvm-opts
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: furnace_db
      DB_USER: ${POSTGRES_USER:-twin}
      DB_PASS: ${POSTGRES_PASSWORD}
      EUREKA_URI: http://twin-eureka:8761/eureka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://twin-config:8888
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      timescaledb:
        condition: service_started
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - twin-net
    restart: unless-stopped
  api-gateway:
    build: ./services/api-gateway
    container_name: twin-api-gateway
    mem_limit: 512m
    <<: *restart-policy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://twin-config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://twin-eureka:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      # 沒設的話 gateway 只允許 localhost，瀏覽器送 Origin: https://<網域> 會被 403
      - CORS_ALLOWED_ORIGINS=https://${APP_HOST}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - twin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  auth-service:
    build: ./services/auth-service
    image: tommy840602/czochralski-auth-service:latest
    container_name: auth-service
    mem_limit: 512m
    depends_on:
      - timescaledb
      - eureka-server
      - redis
    environment:
      JAVA_TOOL_OPTIONS: *jvm-opts
      # `oauth` profile 才會載入 spring.security.oauth2.client 那段設定。
      # ⚠ 啟用後，GITHUB / GOOGLE / AZURE 的 client-id 與 secret「全部」都要有值，
      #   任何一組是空字串 → Spring 拒絕啟動（Client id must not be empty）。
      #   不想接第三方登入就把這行拿掉，SecurityConfig 會自動只掛帳密登入。
      SPRING_PROFILES_ACTIVE: oauth
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: authdb
      DB_USER: ${POSTGRES_USER:-twin}
      DB_PASS: ${POSTGRES_PASSWORD}
      EUREKA_URI: http://twin-eureka:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 少了這個 → NOAUTH → 簡訊驗證碼存不進 Redis → 註冊直接失敗
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REGISTER_SMS_REQUIRED: "true"
      EMAIL_FROM: no-reply@${DOMAIN}
      PWD_RESET_FRONTEND: https://${APP_HOST}/reset-password
      # ⚠ 帶 /api：正式站的公開入口是 Caddy → 前端 nginx，
      #   nginx 會把 /api/login/** 剝掉前綴再送進 gateway 的 /login/**。
      #   所以 OAuth 供應商那邊要登記的 callback 是
      #     https://<APP_HOST>/api/login/oauth2/code/{github|google|azure}
      #   改 APP_HOST 時，這三個外部後台也要一起改，否則 redirect_uri_mismatch。
      OAUTH_REDIRECT_BASE: https://${APP_HOST}/api
      OAUTH_FRONTEND_CALLBACK: https://${APP_HOST}/login/callback
      OAUTH_FRONTEND_LOGIN: https://${APP_HOST}/login
      # OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      # SMS
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Email
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # reCAPTCHA
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
    # ports: 不對外發布（只有 caddy 綁 80/443）
    networks:
      - twin-net
    restart: unless-stopped

  frontend:
    build: frontend
    container_name: twin-frontend
    mem_limit: 128m
    <<: *restart-policy
    # ports: 不對外發布（只有 caddy 綁 80/443）
    depends_on:
      api-gateway:
        condition: service_healthy
      furnace-service:
        condition: service_healthy
    networks:
      - twin-net

  flink-job-submitter:
    image: curlimages/curl:latest
    container_name: twin-flink-submitter
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - ./services/flink-jobs/target:/jars:ro
    networks:
      - twin-net
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Flink..."
        sleep 10
        echo "Uploading jar..."
        RESPONSE=$$(curl -s -X POST http://twin-flink-jobmanager:8081/jars/upload \
          -H "Expect:" \
          -F "jarfile=@/jars/flink-jobs-1.0.0-SNAPSHOT.jar")
        JAR_ID=$$(echo $$RESPONSE | grep -o '"filename":"[^"]*"' | sed 's|.*upload/||;s|"||g')
        echo "JAR ID: $$JAR_ID"
        sleep 3
        curl -s -X POST "http://twin-flink-jobmanager:8081/jars/$$JAR_ID/run" \
          -H "Content-Type: application/json" \
          -d '{"entryClass":"com.twin.flink.job.FurnaceStreamJob","parallelism":1}'
        echo "Job submitted!"

  simulator-d1:
    build: ./datapipe
    container_name: twin-simulator-d1
    # 實測 FA 用到 112 MiB（87% of 128m）——CSV 最大的那台，放寬避免被殺
    mem_limit: 192m
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "D1", "--csv", "data/D1_all.csv", "--interval", "1.0", "--host", "twin-mosquitto", "--api-port", "8091", "--loop"]
    networks:
      - twin-net

  simulator-d3:
    build: ./datapipe
    container_name: twin-simulator-d3
    # 實測 FA 用到 112 MiB（87% of 128m）——CSV 最大的那台，放寬避免被殺
    mem_limit: 192m
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "D3", "--csv", "data/D3_all.csv", "--interval", "1.0", "--host", "twin-mosquitto", "--api-port", "8092", "--loop"]
    networks:
      - twin-net

  simulator-db:
    build: ./datapipe
    container_name: twin-simulator-db
    # 實測 FA 用到 112 MiB（87% of 128m）——CSV 最大的那台，放寬避免被殺
    mem_limit: 192m
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "DB", "--csv", "data/DB_all.csv", "--interval", "1.0", "--host", "twin-mosquitto", "--api-port", "8093", "--loop"]
    networks:
      - twin-net

  simulator-f7:
    build: ./datapipe
    container_name: twin-simulator-f7
    # 實測 FA 用到 112 MiB（87% of 128m）——CSV 最大的那台，放寬避免被殺
    mem_limit: 192m
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "F7", "--csv", "data/F7_all.csv", "--interval", "1.0", "--host", "twin-mosquitto", "--api-port", "8094", "--loop"]
    networks:
      - twin-net

  simulator-fa:
    build: ./datapipe
    container_name: twin-simulator-fa
    # 實測 FA 用到 112 MiB（87% of 128m）——CSV 最大的那台，放寬避免被殺
    mem_limit: 192m
    <<: [*restart-policy, *default-logging]
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "main.py", "--furnace", "FA", "--csv", "data/FA_all.csv", "--interval", "1.0", "--host", "twin-mosquitto", "--api-port", "8095", "--loop"]
    networks:
      - twin-net
