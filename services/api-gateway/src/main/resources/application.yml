server:
  port: 8085
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: furnace-service
          uri: lb://furnace-service
          predicates:
            - Path=/api/furnaces/**
          filters:
            - StripPrefix=1
        - id: alarm-service
          uri: lb://alarm-service
          predicates:
            - Path=/api/alarms/**
          filters:
            - StripPrefix=1
        - id: alarm-spc
          uri: http://alarm-service:8092
          predicates:
            - Path=/api/spc/**
          filters:
            - StripPrefix=1
        - id: alarm-oee
          uri: http://alarm-service:8092
          predicates:
            - Path=/api/oee/**
          filters:
            - StripPrefix=1
        - id: furnace-ws
          uri: lb:ws://furnace-service
          predicates:
            - Path=/ws/**
        - id: twin-state-service
          uri: lb://twin-state-service
          predicates:
            - Path=/api/twin/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: auth-oauth2
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**
        - id: auth-oauth2-callback
          uri: lb://auth-service
          predicates:
            - Path=/login/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3001"
              - "http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: CircuitBreaker
          args:
            name: defaultCB
            fallbackUri: forward:/fallback
resilience4j:
  timelimiter:
    instances:
      defaultCB:
        timeout-duration: 120s
  circuitbreaker:
    instances:
      defaultCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
app:
  jwt:
    # 上 prod 從 Config server / 環境變數注入，且務必 >= 32 字元
    secret: ${JWT_SECRET}
    access-ttl-min: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}