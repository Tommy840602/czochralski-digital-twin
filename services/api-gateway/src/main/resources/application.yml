server:
  port: 8085
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: furnace-service
          uri: lb://furnace-service
          predicates:
            - Path=/api/furnaces/**
          filters:
            - StripPrefix=1
        - id: alarm-service
          uri: lb://alarm-service
          predicates:
            - Path=/api/alarms/**
          filters:
            - StripPrefix=1
        - id: alarm-spc
          uri: http://alarm-service:8092
          predicates:
            - Path=/api/spc/**
          filters:
            - StripPrefix=1
        - id: alarm-oee
          uri: http://alarm-service:8092
          predicates:
            - Path=/api/oee/**
          filters:
            - StripPrefix=1
        - id: furnace-ws
          uri: lb:ws://furnace-service
          predicates:
            - Path=/ws/**
        - id: twin-state-service
          uri: lb://twin-state-service
          predicates:
            - Path=/api/twin/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: auth-oauth2
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**
        - id: auth-oauth2-callback
          uri: lb://auth-service
          predicates:
            - Path=/login/**
      globalcors:
        cors-configurations:
          '[/**]':
            # ⚠ 正式環境一定要把自己的網域加進來，否則瀏覽器一律 403。
            #
            #   容易誤會的點：前端和 API 明明同源，為什麼還會觸發 CORS？
            #   因為依 Fetch 規範，「非 GET/HEAD 的請求（POST/PUT/DELETE）
            #   即使同源，瀏覽器也會帶 Origin header」。Gateway 只要看到 Origin
            #   就會套 CORS 規則，不在白名單就回 403。
            #
            #   結果就是：GET /api/furnaces 正常，但 POST /api/auth/login 被擋，
            #   連 SockJS 的 xhr_send（也是 POST）都 403 → WebSocket 也連不上。
            #   而 curl 不送 Origin，所以怎麼測都是 200，問題只在瀏覽器出現。
            #
            #   逗號分隔，Spring 會自動綁成 List。
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3001,http://localhost}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: CircuitBreaker
          args:
            name: defaultCB
            fallbackUri: forward:/fallback
resilience4j:
  timelimiter:
    instances:
      defaultCB:
        timeout-duration: 120s
  circuitbreaker:
    instances:
      defaultCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
app:
  jwt:
    # 上 prod 從 Config server / 環境變數注入，且務必 >= 32 字元
    secret: ${JWT_SECRET}
    access-ttl-min: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}