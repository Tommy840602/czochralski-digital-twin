server:
  port: 8091

spring:
  application:
    name: furnace-service
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:postgresql://localhost:5433/furnace_db
    username: twin
    password: twin_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2

  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ...(management / cors / furnace / logging / openai 原樣不動)...

# ════════════════════════════════════════════════════════════
#  容器環境覆蓋（啟動時帶 SPRING_PROFILES_ACTIVE=docker）
# ════════════════════════════════════════════════════════════
---
spring:
  config:
    activate:
      on-profile: docker
    import: "optional:configserver:http://twin-config:8888"
  datasource:
    url: jdbc:postgresql://twin-timescaledb:5432/furnace_db
  data:
    redis:
      host: twin-redis
  kafka:
    bootstrap-servers: twin-kafka:9093

eureka:
  client:
    service-url:
      defaultZone: http://twin-eureka:8761/eureka/
