server:
  port: 8092

spring:
  application:
    name: alarm-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:furnace_db}
    username: ${DB_USER:twin}
    password: ${DB_PASS:twin_secret}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: true
    consumer:
      group-id: alarm-service-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    mongodb:
      uri: mongodb://twin:twin_secret@localhost:27017/twin_db?authSource=admin

slack:
  webhook:
    url: ""

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mongo:
      enabled: false
    diskspace:
      enabled: false

logging:
  level:
    com.twin.alarm: INFO
    org.springframework.kafka: WARN
