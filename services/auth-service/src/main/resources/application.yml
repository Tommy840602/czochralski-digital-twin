server:
  port: 8093

spring:
  application:
    name: auth-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 正式環境的 Redis 開了 requirepass；本機開發沒有，留空即可。
      # 少了這行 → NOAUTH → 簡訊驗證碼存不進 Redis → 註冊流程直接掛掉。
      password: ${REDIS_PASSWORD:}
  datasource:
    # 預設指向本機 TimescaleDB（host port 5433）方便 IntelliJ 直跑；
    # docker-compose 會用環境變數覆寫成 service 名稱與 5432。
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:authdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: update          # 開發用；上 prod 換 Flyway，ddl-auto 改 validate
    defer-datasource-initialization: true   # 讓 Hibernate 先建表，data.sql 再 seed
    open-in-view: false
    properties:
      hibernate.format_sql: true
    show-sql: false

  sql:
    init:
      mode: always              # 每次啟動跑 data.sql（內含 ON CONFLICT DO NOTHING，冪等）

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}

app:
  # ⚠ 這三個「面向使用者的網址」原本沒有任何地方接環境變數。
  #
  #   程式碼是 @Value("${app.oauth.frontend-callback:http://localhost:5173/login/callback}")，
  #   compose 注入的卻是 OAUTH_FRONTEND_CALLBACK ——兩者對不上。
  #   Spring 的 relaxed binding 只認 APP_OAUTH_FRONTEND_CALLBACK，
  #   所以那些環境變數根本沒被讀到，一律落回 localhost:5173 的預設值。
  #
  #   症狀：OAuth 授權明明成功，最後卻被導回 http://localhost:5173/login/callback。
  #   密碼重設信裡的連結也是 localhost（同一個 bug，只是還沒人點到）。
  #
  #   這裡明確把環境變數接上，dev 不填就沿用 localhost 預設，行為不變。
  oauth:
    frontend-callback: ${OAUTH_FRONTEND_CALLBACK:http://localhost:5173/login/callback}
    frontend-login: ${OAUTH_FRONTEND_LOGIN:http://localhost:5173/login}
  password-reset:
    frontend-base: ${PWD_RESET_FRONTEND:http://localhost:5173/reset-password}

  jwt:
    # 上 prod 從 Config server / 環境變數注入，且務必 >= 32 字元
    secret: ${JWT_SECRET}
    access-ttl-min: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  sms:
    provider: ${SMS_PROVIDER:log}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM_NUMBER:}
  email:
    provider: ${EMAIL_PROVIDER:log}
    from: ${EMAIL_FROM:no-reply@twin.local}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    # ⚠ 千萬不要在正式環境開 DEBUG。
    #
    #   org.springframework.web 的 DEBUG 會把「每個 request body 原封不動印出來」，
    #   包含 /auth/login 的明文密碼、/auth/register 的密碼、密碼重設 token：
    #
    #     Read "application/json" to [LoginRequest[usernameOrEmail=admin, password=admin1234]]
    #                                                                     ^^^^^^^^^^^^^^^^^^^
    #   這些 log 會進 docker logs，開了 ELK 之後還會進 Elasticsearch——
    #   任何拿得到 log 的人等於拿到所有使用者的密碼。
    #
    #   要在本機除錯就設環境變數：LOG_LEVEL_SECURITY=DEBUG LOG_LEVEL_WEB=DEBUG
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}

---
# ════════════════════════════════════════════════════════════════════
#  第三方登入（GitHub / Google / Azure）── 預設「不啟用」
#
#  為什麼要放在 profile 裡：
#    Spring Boot 只要看到 client-id 是空字串就直接拒絕啟動
#    （"Client id must not be empty"），auth-service 會無限重啟。
#    把整段包進 profile，沒啟用時 Spring 根本看不到這些設定，
#    也就不會建立 ClientRegistrationRepository —— SecurityConfig 偵測不到
#    這個 bean，就只掛帳號密碼登入。
#
#  要啟用：
#    1. 到各家建立 OAuth App，callback URL 填（注意中間的 /api）：
#         https://<你的網域>/api/login/oauth2/code/github
#         https://<你的網域>/api/login/oauth2/code/google
#         https://<你的網域>/api/login/oauth2/code/azure
#       （/api 會被前端 nginx 剝掉再送進 gateway 的 /login/**）
#    2. .env.prod 填好 GITHUB_CLIENT_ID / SECRET…等
#    3. compose 的 SPRING_PROFILES_ACTIVE 加上 oauth，例如 "docker,oauth"
#    4. 前端 LoginView.vue 的第三方登入按鈕改回顯示
#
#  ⚠ 啟用時「這一段列出的每一組」client-id 都必須有值。
#     只想用 GitHub 的話，請把 google / azure 兩段刪掉。
# ════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: oauth
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email
            redirect-uri: "${OAUTH_REDIRECT_BASE:http://localhost:8085}/login/oauth2/code/github"
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "${OAUTH_REDIRECT_BASE:http://localhost:8085}/login/oauth2/code/google"
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE:http://localhost:8085}/login/oauth2/code/azure"
        provider:
          azure:
            authorization-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
