name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Build Spring Boot JAR ──
  build-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build Spring Boot Services
        working-directory: services
        run: mvn clean package -DskipTests

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: spring-jars
          path: services/*/target/*.jar
          retention-days: 1

  # ── Job 2: Build & Push Docker Images ──
  build-docker:
    needs: build-services
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: spring-jars
          path: services

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push eureka-server
        uses: docker/build-push-action@v5
        with:
          context: services/eureka-server
          push: true
          tags: tommy840602/czochralski-eureka:latest

      - name: Build & Push config-server
        uses: docker/build-push-action@v5
        with:
          context: services/config-server
          push: true
          tags: tommy840602/czochralski-config:latest

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: services/api-gateway
          push: true
          tags: tommy840602/czochralski-api-gateway:latest

      - name: Build & Push iot-gateway
        uses: docker/build-push-action@v5
        with:
          context: services/iot-gateway
          push: true
          tags: tommy840602/czochralski-iot-gateway:latest

      - name: Build & Push furnace-service
        uses: docker/build-push-action@v5
        with:
          context: services/furnace-service
          push: true
          tags: tommy840602/czochralski-furnace:latest

      - name: Build & Push alarm-service
        uses: docker/build-push-action@v5
        with:
          context: services/alarm-service
          push: true
          tags: tommy840602/czochralski-alarm:latest

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: tommy840602/czochralski-frontend:latest
          build-args: |
            NODE_VERSION=20

  # ── Job 3: Deploy to Server ──
  deploy:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/czochralski-digital-twin
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "部署完成！"
