server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        proxy_pass http://twin-furnace-service:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ─────────────────────────────────────────────────────────────
    #  auth / oauth2 / login：要「剝掉 /api 前綴」再送給 gateway
    #
    #  gateway 的路由是 Path=/auth/**、/oauth2/**、/login/**（沒有 /api），
    #  但前端的 axios baseURL 是 '/api'，所以送出來的是 /api/auth/login。
    #  dev 環境靠 vite proxy 的 rewrite 剝掉前綴；正式環境沒人做這件事，
    #  gateway 收到 /api/auth/login 找不到路由 → 404，登入整個壞掉。
    #
    #  proxy_pass 後面「有結尾斜線」時，nginx 會用它取代 location 匹配到的前綴，
    #  等同於 rewrite。順序也很重要：這三條要放在通用的 /api 之前。
    # ─────────────────────────────────────────────────────────────
    location /api/auth/ {
        proxy_pass http://twin-api-gateway:8085/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/oauth2/ {
        proxy_pass http://twin-api-gateway:8085/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OAuth 供應商（GitHub / Google / Azure）把使用者導回來的 callback
    location /api/login/ {
        proxy_pass http://twin-api-gateway:8085/login/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其餘 API：/api/furnaces、/api/spc、/api/oee… gateway 那邊有 StripPrefix=1，
    # 所以這裡「保留」/api 前綴，不要加結尾斜線。
    location /api {
        proxy_pass http://twin-api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
