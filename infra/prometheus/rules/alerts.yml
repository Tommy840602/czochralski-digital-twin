groups:
  - name: czochralski-digital-twin
    interval: 30s
    rules:

      # ── Kafka Consumer Lag 告警 ──
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Kafka Consumer Lag 過高 ({{ $value }})"
          description: "Consumer group {{ $labels.consumergroup }} topic {{ $labels.topic }} lag={{ $value }}"

      # ── Flink Job 失敗 ──
      - alert: FlinkJobFailed
        expr: flink_jobmanager_job_numFailedCheckpoints > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Flink Job Checkpoint 失敗"
          description: "失敗次數: {{ $value }}"

      # ── Spring Boot 服務下線 ──
      - alert: ServiceDown
        expr: up{job="spring-boot-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "微服務下線: {{ $labels.service }}"
          description: "{{ $labels.instance }} 已無法連線"

      # ── Redis 記憶體使用率 ──
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 記憶體使用率超過 90%"

      # ── TimescaleDB 連線數 ──
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TimescaleDB 連線數過高 ({{ $value }})"
