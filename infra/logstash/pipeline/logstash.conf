input {
  # Spring Boot 透過 TCP 送 JSON log
  tcp {
    port => 5000
    codec => json_lines
    tags => ["spring-boot"]
  }

  # Beats (Filebeat) 輸入
  beats {
    port => 5044
    tags => ["filebeat"]
  }
}

filter {
  # ── 解析 Spring Boot JSON log ──
  if "spring-boot" in [tags] {
    date {
      match => ["timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      rename => { "level"   => "log_level" }
      rename => { "logger"  => "logger_name" }
      rename => { "message" => "log_message" }
      add_field => { "env" => "development" }
      add_field => { "project" => "czochralski-digital-twin" }
    }

    # 把 Alarm 相關 log 標記
    if [log_message] =~ /ALARM|NgDisconnect|CsvEnd|Event=6/ {
      mutate { add_tag => ["alarm"] }
    }
  }

  # ── 丟棄健康檢查 log ──
  if [log_message] =~ /actuator\/health/ {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "system_logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # 告警 log 也發到獨立 index
  if "alarm" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "alarm_logs-%{+YYYY.MM.dd}"
    }
  }

  # 開發時也輸出到 stdout
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
